name: mobile

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: aura_core (pure Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/packages/aura_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test --reporter expanded
      # Formatting is checked last and published as a patch to apply locally.
      - name: Format check
        id: fmt
        continue-on-error: true
        run: |
          dart format --line-length 120 lib test
          git diff --exit-code -- . > /dev/null || { git diff -- . > "$RUNNER_TEMP/format.patch"; exit 1; }
      - if: steps.fmt.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: format-patch-core
          path: ${{ runner.temp }}/format.patch

  app:
    name: Flutter app (analyze, test, Android build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      # First run only: generate the android/ and ios/ projects, published as
      # an artifact to commit (afterwards they are customised in the repo).
      - name: Scaffold platform projects if missing
        id: scaffold
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --org com.tanishadot --project-name aurasight --platforms android,ios --no-pub .
            rm -f test/widget_test.dart
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scaffold.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: platform-scaffold
          path: |
            mobile/app/android
            mobile/app/ios
            mobile/app/.metadata
          include-hidden-files: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: aurasight-debug-apk
          path: mobile/app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      - name: Format check
        id: fmt
        continue-on-error: true
        run: |
          dart format --line-length 120 lib test
          git diff --exit-code -- . > /dev/null || { git diff -- . > "$RUNNER_TEMP/format.patch"; exit 1; }
      - if: steps.fmt.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: format-patch-app
          path: ${{ runner.temp }}/format.patch

  ios:
    name: iOS build (simulator, unsigned)
    runs-on: macos-latest
    needs: app
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
