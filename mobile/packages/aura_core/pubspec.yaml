name: aura_core
description: >-
  Platform-independent AuraSight logic shared by the Android and iOS apps:
  tracking, object verification, spatial descriptions, scene events,
  announcements and the speech queue. Pure Dart, no Flutter dependency.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
