name: mobile

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Android detector model. Exported once from the pinned YOLO11n weights and
  # published as a release asset (model binaries stay out of Git); every later run
  # downloads it and validates it against the committed manifest.
  detector-model:
    name: Detector model (export or fetch, validate)
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/upload the model release asset
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: mobile-models-v1
      FILE: yolo11n_320_float32.tflite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: mode
        run: |
          if [ -f mobile/app/assets/models/detector.json ]; then echo "mode=validate" >> "$GITHUB_OUTPUT"; else echo "mode=export" >> "$GITHUB_OUTPUT"; fi
      - name: Export YOLO11n to TFLite (first run only)
        if: steps.mode.outputs.mode == 'export'
        run: |
          # Pinned: Ultralytics 8.4.8x moved TFLite export to a litert-torch path that currently fails
          # (duplicate aten op registration); 8.3.100 uses the proven ONNX to onnx2tf route.
          # A PyTorch contemporary with that release (newer ones need onnxscript and pick opset 9).
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "ultralytics==8.3.100" "tensorflow==2.19.0" "onnx==1.17.0" opencv-python-headless
          python mobile/tools/export_detector.py export --out dist
      - name: Publish model as a release asset (first run only, never overwritten)
        if: steps.mode.outputs.mode == 'export'
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --prerelease             --title "AuraSight mobile models v1"             --notes "On-device models for the AuraSight mobile app. YOLO11n by Ultralytics (AGPL-3.0), exported to LiteRT/TFLite (FP32) at 320x320 by mobile/tools/export_detector.py."
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$FILE"; then
            echo "::warning::$FILE is already published; keeping the published file (it is what the app downloads)."
          else
            gh release upload "$TAG" "dist/$FILE"
          fi
      - name: Build the manifest from the published file
        if: steps.mode.outputs.mode == 'export'
        run: |
          mkdir -p published
          gh release download "$TAG" -p "$FILE" -D published --clobber
          python mobile/tools/export_detector.py manifest --model "published/$FILE" --out dist
      - name: Fetch and validate the published model
        if: steps.mode.outputs.mode == 'validate'
        run: |
          pip install ai-edge-litert opencv-python-headless numpy
          gh release download "$TAG" -p "$FILE" -D dist --clobber
          python mobile/tools/export_detector.py validate --model "dist/$FILE" --report dist/parity.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-model-report
          path: |
            dist/detector.json
            dist/parity.md

  core:
    name: aura_core (pure Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/packages/aura_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test --reporter expanded
      # Formatting is checked last and published as a patch to apply locally.
      - name: Format check
        id: fmt
        continue-on-error: true
        run: |
          dart format --line-length 120 lib test
          git diff --exit-code -- . > /dev/null || { git diff -- . > "$RUNNER_TEMP/format.patch"; exit 1; }
      - if: steps.fmt.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: format-patch-core
          path: ${{ runner.temp }}/format.patch

  app:
    name: Flutter app (analyze, test, Android build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      # First run only: generate the android/ and ios/ projects, published as
      # an artifact to commit (afterwards they are customised in the repo).
      - name: Scaffold platform projects if missing
        id: scaffold
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --org com.tanishadot --project-name aurasight --platforms android,ios --no-pub .
            rm -f test/widget_test.dart
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scaffold.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: platform-scaffold
          path: |
            mobile/app/android
            mobile/app/ios
            mobile/app/.metadata
          include-hidden-files: true
      - run: flutter pub get
      - name: Generate integration-test fixtures (needed to analyse integration_test/)
        run: python3 ../tools/gen_integration_fixtures.py
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
      - run: flutter build apk --debug
      - name: "Native unit tests (Kotlin): letterbox, YUV/rotation sampling, decoding, NMS"
        working-directory: mobile/app/android
        run: ./gradlew :aura_native:testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: aurasight-debug-apk
          path: mobile/app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      - name: Format check
        id: fmt
        continue-on-error: true
        run: |
          dart format --line-length 120 lib test
          git diff --exit-code -- . > /dev/null || { git diff -- . > "$RUNNER_TEMP/format.patch"; exit 1; }
      - if: steps.fmt.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: format-patch-app
          path: ${{ runner.temp }}/format.patch

  ios:
    name: iOS build (simulator, unsigned)
    runs-on: macos-latest
    needs: app
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug

  # Runs the real app code (Dart + Kotlin + LiteRT) on an Android emulator:
  # genuine model download and SHA-256 check, load + self-test, offline reload,
  # parity with the desktop detector on the fixture photos, and the camera YUV path.
  android-device-test:
    name: Android emulator integration test (detector)
    runs-on: ubuntu-latest
    needs: [detector-model, app]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: test -f mobile/app/assets/models/detector.json && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.check.outputs.ok == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable KVM
        if: steps.check.outputs.ok == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - if: steps.check.outputs.ok == 'true'
        run: python3 mobile/tools/gen_integration_fixtures.py
      - if: steps.check.outputs.ok == 'true'
        working-directory: mobile/app
        run: flutter pub get
      - if: steps.check.outputs.ok == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile/app
          script: flutter test integration_test/detector_test.dart -d emulator-5554 --reporter expanded > ../../integration.log 2>&1; status=$?; cat ../../integration.log; exit $status
      - if: always() && steps.check.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-log
          path: integration.log
